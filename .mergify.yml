# Inactive until Workflow Automation is enabled for this repository.
# Keep these conditions aligned with queue_rules.main.queue_conditions.
pull_request_rules:
  - name: Automatic merge on approval
    conditions:
      - "#approved-reviews-by>=1"
      - label!=do-not-merge
      - base=main
    actions:
      queue:
        name: main
queue_rules:
  - name: main
    # Enforce eligibility even when Workflow Automation is disabled.
    queue_conditions:
      - "#approved-reviews-by>=1"
      - label!=do-not-merge
      - base=main
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers:
        - approved-by
    checks_timeout: 1 h
merge_queue:
  max_parallel_checks: 1
