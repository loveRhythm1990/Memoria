pull_request_rules:
  - name: Automatic merge on approval
    conditions:
      - "#approved-reviews-by>=1"
      - label!=do-not-merge
      - base=main
    actions:
      queue:
        name: main
queue_rules:
  - name: main
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers:
        - approved-by
    checks_timeout: 1 h
merge_queue:
  max_parallel_checks: 1
